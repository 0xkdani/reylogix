<!doctype html>
<!-- `dark` fijo: el sitio es oscuro siempre, y con darkMode: 'class' en
     Tailwind es lo que activa las variantes dark: de los componentes shadcn. -->
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A0C0F" />
    <!-- Inter va auto-alojada (los @font-face estan en src/index.css), asi que
         ya no hay hoja de estilos externa que bloquee el render ni preconnect a
         googleapis/gstatic. Solo se precarga el subconjunto latin, que es el
         unico que llega a descargarse con texto en castellano. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <meta
      name="description"
      content="Reylogix diseña soluciones logísticas estratégicas con resultados medibles: auditoría de costos, documentación aduanal, diagnóstico operativo y rediseño de procesos."
    />
    <title>Reylogix — Ejecución precisa. Resultados reales.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
